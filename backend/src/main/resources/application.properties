# Spring Boot Application Configuration
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/friendship_db\nspring.datasource.username=root\nspring.datasource.password=your_password_here\nspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver\n\n# JPA/Hibernate Configuration\nspring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=false\nspring.jpa.properties.hibernate.format_sql=true\n\n# Server Configuration\nserver.port=8080\nserver.servlet.context-path=/api\nserver.servlet.session.timeout=30m\n\n# JWT Configuration\njwt.secret=your_super_secret_jwt_key_minimum_32_characters_long_for_security\njwt.expiration=86400000\njwt.refresh.expiration=604800000\n\n# File Upload Configuration\nfile.upload-dir=uploads/\nfile.max-size=5242880\nfile.allowed-types=jpg,jpeg,png,gif,pdf,wav,mp3\n\n# Email Configuration\nspring.mail.host=smtp.gmail.com\nspring.mail.port=587\nspring.mail.username=your_email@gmail.com\nspring.mail.password=your_app_password\nspring.mail.properties.mail.smtp.auth=true\nspring.mail.properties.mail.smtp.starttls.enable=true\nspring.mail.properties.mail.smtp.starttls.required=true\n\n# Logging Configuration\nlogging.level.root=INFO\nlogging.level.com.friendship=DEBUG\nlogging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n\n\n# Application Configuration\napp.name=Friendship Biodata Memories\napp.version=1.0.0\napp.cors.allowed-origins=http://localhost:3000,http://localhost:8080\napp.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS\napp.cors.max-age=3600\n